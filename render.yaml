# Render blueprint for the FastAPI backend.
#
# Secrets are marked `sync: false`: Render prompts for them when the blueprint
# is applied and they never appear in this repository.
#
# Migrations are run manually (`alembic upgrade head` from apps/api against the
# Supabase session pooler), not on deploy. Render's pre-deploy command is a
# paid feature, and putting migrations in the build step would couple a code
# deploy to a schema change without anyone choosing it.

services:
  - type: web
    name: fleet-maintenance-api
    runtime: python
    plan: free
    # Nearest Render region to the Supabase project in ap-south-1 (Mumbai).
    # Every query is a round trip between the two, so this multiplies.
    region: singapore
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # /health touches the database, so a deploy that cannot reach Postgres
    # fails loudly instead of serving 503s.
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      # Supabase transaction pooler (port 6543).
      - key: DATABASE_URL
        sync: false
      # Supabase session pooler (port 5432), for Alembic.
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated. The Vercel origin is added once the frontend exists.
      - key: CORS_ORIGINS
        sync: false
      - key: OVERDUE_GRACE_PERIOD_DAYS
        value: 7
